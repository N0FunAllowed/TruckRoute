name: CI

on:
  push:
    branches: [master, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test TruckRoute
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available \
            | grep -E '^[[:space:]]+iPhone' \
            | head -n 1 \
            | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator available on this runner." >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          xcodebuild test \
            -project TruckRoute.xcodeproj \
            -scheme TruckRoute \
            -configuration Debug \
            -destination "id=${SIMULATOR_UDID}" \
            CODE_SIGNING_ALLOWED=NO

      # The step above only proves the app builds Debug for a simulator, which
      # is not what shipping does. An archive builds Release for arm64 device,
      # where whole-module optimisation and the device SDK can both fail on
      # code a simulator build accepts. Signing stays off so this needs no
      # credentials — it checks the compile, not the upload.
      - name: Build Release for device
        run: |
          xcodebuild build \
            -project TruckRoute.xcodeproj \
            -scheme TruckRoute \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
